<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Michael Borck</title>
  <meta name="description" content="Personal launcher — everything Michael Borck in one place." />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.svg" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #fafaf6;
      --panel: #f3f2ec;
      --text: #1a1a1c;
      --gray-1: #4a4a4f;
      --gray-2: #82827e;
      --gray-3: #d6d6cf;
      --accent: #4a6e62;
      --font: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, monospace;
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 4rem 2rem 2rem;
    }

    .header { margin-bottom: 2rem; }

    .name {
      font-size: clamp(2.5rem, 5vw, 4rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.0;
      color: var(--text);
    }

    .name .surname { color: var(--accent); }

    .role {
      margin-top: 1rem;
      font-size: 0.95rem;
      color: var(--gray-1);
      line-height: 1.7;
    }

    .search {
      margin: 2rem 0 0;
      position: relative;
    }

    .search input {
      width: 100%;
      padding: 0.85rem 1rem 0.85rem 2.6rem;
      font-family: var(--mono);
      font-size: 0.9rem;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--gray-3);
      border-radius: 10px;
      outline: none;
      transition: border-color 0.15s;
    }

    .search input:focus { border-color: var(--accent); }

    .search .lens {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      color: var(--gray-2);
      pointer-events: none;
    }

    .search .hint {
      position: absolute;
      right: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--gray-2);
      border: 1px solid var(--gray-3);
      border-radius: 5px;
      padding: 0.1rem 0.4rem;
      pointer-events: none;
    }

    .facets {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 1rem;
    }

    .facet {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--gray-1);
      background: transparent;
      border: 1px solid var(--gray-3);
      border-radius: 999px;
      padding: 0.3rem 0.75rem;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }

    .facet:hover { border-color: var(--accent); color: var(--text); }

    .facet.on {
      background: var(--accent);
      border-color: var(--accent);
      color: #fafaf6;
    }

    .facet .n { opacity: 0.65; margin-left: 0.3rem; }

    .search .status {
      margin-top: 0.6rem;
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--gray-2);
      min-height: 1em;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 0.85rem;
    }

    .link {
      display: flex;
      flex-direction: column;
      padding: 1rem 1.2rem;
      background: var(--panel);
      border: 1px solid var(--gray-3);
      border-radius: 10px;
      text-decoration: none;
      color: var(--text);
      transition: border-color 0.15s, transform 0.15s;
    }

    .link:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .link-label { font-weight: 600; font-size: 0.92rem; }
    .link-dest {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--gray-2);
      margin-top: 0.3rem;
      word-break: break-all;
    }
    .link-blurb {
      font-size: 0.78rem;
      color: var(--gray-1);
      line-height: 1.45;
      margin-top: 0.45rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .link-kind {
      font-family: var(--mono);
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent);
      margin-top: 0.5rem;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      padding: 0.5rem 0.9rem;
      background: var(--panel);
      border: 1px solid var(--gray-3);
      border-radius: 999px;
      text-decoration: none;
      color: var(--gray-1);
      font-size: 0.82rem;
      transition: border-color 0.15s, color 0.15s;
    }

    .chip:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    .empty {
      padding: 1.2rem;
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--gray-2);
      border: 1px dashed var(--gray-3);
      border-radius: 10px;
    }

    footer {
      margin-top: 4rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--gray-3);
      font-size: 0.85rem;
      color: var(--gray-2);
    }

    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <div class="header">
    <h1 class="name">Michael<br><span class="surname">Borck</span></h1>
    <p class="role">Everything in one place. Type to find it.</p>
  </div>

  <div class="search">
    <span class="lens"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg></span>
    <input id="q" type="search" placeholder="filter — title, blurb, domain or keyword" autocomplete="off" spellcheck="false" />
    <span class="hint">/</span>
    <div class="facets" id="facets"></div>
    <div class="status" id="status"></div>
  </div>

  <section data-section="registry">
    <div class="grid" id="reg"></div>
    <div class="empty" id="empty" hidden>Nothing matches. Clear the search or pick another facet.</div>
  </section>

  <section data-section="elsewhere">
    <h2 class="section-label" style="font-size:0.7rem;font-weight:600;text-transform:uppercase;letter-spacing:0.12em;color:var(--gray-2);margin:3rem 0 1rem;">Elsewhere</h2>
    <div class="chips" id="elsewhere"></div>
  </section>

  <footer>
    <p>Michael Borck · Perth, WA · <a href="mailto:hello@borck.dev">hello@borck.dev</a></p>
  </footer>
</main>

<script src="registry.js"></script>
<script>
const KIND_ORDER = ['site', 'book', 'tool', 'simulation', 'research', 'deck', 'game', 'curtin', 'repo', 'profile'];
const KIND_LABEL = { site: 'Sites', book: 'Books & Writing', tool: 'Tools', simulation: 'Simulations',
  research: 'Research', deck: 'Decks', game: 'Games', curtin: 'At Curtin', repo: 'Repos', profile: 'Profiles' };

let kind = 'all';
const input = document.getElementById('q');
const status = document.getElementById('status');
const regGrid = document.getElementById('reg');
const elsewhere = document.getElementById('elsewhere');
const emptyBox = document.getElementById('empty');

const profiles = REGISTRY.filter((e) => e.kind === 'profile');
const works = REGISTRY.filter((e) => e.kind !== 'profile');

function destOf(e) {
  let d = e.dest || e.url || '';
  if (e.local) d += ' · local';
  return d;
}

for (const e of works) {
  const el = document.createElement(e.url ? 'a' : 'div');
  el.className = 'link';
  if (e.url) el.href = e.url;
  el.dataset.haystack = `${e.title} ${e.dest || ''} ${e.blurb || ''} ${e.tags} ${e.kind}`.toLowerCase();
  el.dataset.kind = e.kind;
  el.innerHTML = `<span class="link-label">${e.title}</span>` +
    `<span class="link-dest">${destOf(e)}</span>` +
    (e.blurb ? `<span class="link-blurb">${e.blurb}</span>` : '') +
    `<span class="link-kind">${e.kind}</span>`;
  regGrid.appendChild(el);
}

for (const e of profiles) {
  const a = document.createElement('a');
  a.className = 'chip';
  a.href = e.url;
  a.dataset.haystack = `${e.title} ${e.tags} ${e.url}`.toLowerCase();
  a.dataset.kind = 'profile';
  a.textContent = e.title;
  elsewhere.appendChild(a);
}

const kinds = [...new Set(REGISTRY.map((e) => e.kind))]
  .sort((a, b) => (KIND_ORDER.indexOf(a) ?? 99) - (KIND_ORDER.indexOf(b) ?? 99));
const facets = document.getElementById('facets');
const allBtn = document.createElement('button');
allBtn.className = 'facet on';
allBtn.dataset.k = 'all';
allBtn.textContent = `All ${REGISTRY.length}`;
facets.appendChild(allBtn);
for (const k of kinds) {
  const n = REGISTRY.filter((e) => e.kind === k).length;
  const b = document.createElement('button');
  b.className = 'facet';
  b.dataset.k = k;
  b.innerHTML = `${KIND_LABEL[k] || k}<span class="n">${n}</span>`;
  facets.appendChild(b);
}
facets.addEventListener('click', (e) => {
  const k = e.target.dataset.k;
  if (!k) return;
  kind = k;
  [...facets.children].forEach((b) => b.classList.toggle('on', b.dataset.k === k));
  apply();
});

function apply() {
  const q = input.value.trim().toLowerCase();
  let shown = 0;
  for (const el of document.querySelectorAll('[data-haystack]')) {
    const hitKind = kind === 'all' || el.dataset.kind === kind;
    const hitQ = !q || el.dataset.haystack.includes(q);
    const show = hitKind && hitQ;
    el.hidden = !show;
    if (show) shown++;
  }
  document.querySelector('section[data-section="elsewhere"]').hidden = kind !== 'all' && kind !== 'profile';
  emptyBox.hidden = shown !== 0;
  status.textContent = q || kind !== 'all' ? `${shown} of ${REGISTRY.length} match` : '';
}
input.addEventListener('input', apply);
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement !== input) { e.preventDefault(); input.focus(); }
  if (e.key === 'Escape') { input.value = ''; apply(); input.blur(); }
});
apply();
</script>
</body>
</html>
