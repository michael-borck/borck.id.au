# Curation layer for the borck.id.au registry.
# build-registry.py merges this over the generated entries, so re-runs
# never lose judgment. Keys: pinned (always shown, in order), profiles,
# hide (ids to drop), extra_tags (id -> extra keywords).

pinned:
  - id: bio
    title: Bio
    kind: site
    dest: borck.dev
    url: https://borck.dev
    tags: hub home wall
    order: 0
  - id: decks-engine
    title: Deck engine
    kind: deck
    dest: deck-engine.borck.dev
    url: https://deck-engine.borck.dev
    tags: slides html markdown presentations
  - id: decks-cards
    title: Card decks
    kind: deck
    dest: borck.consulting/decks
    url: https://borck.consulting/decks/
    tags: printable cards workshops analogue

profiles:
