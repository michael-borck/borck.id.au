  - { id: aboutme, label: about.me, url: "https://about.me/michaelborck", tags: profile }
  - { id: facebook, label: Facebook, url: "https://www.facebook.com/michael.borck/", tags: social }
  - { id: github, label: GitHub, url: "https://github.com/michael-borck", tags: code repos }
  - { id: scholar, label: Google Scholar, url: "https://scholar.google.com/citations?user=fwNMowoAAAAJ&hl=en", tags: citations papers }
  - { id: linkedin, label: LinkedIn, url: "https://linkedin.com/in/michaelborck", tags: social }
  - { id: orcid, label: ORCID, url: "https://orcid.org/0000-0002-0950-6396", tags: researcher id }
